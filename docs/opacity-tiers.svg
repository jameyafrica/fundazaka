<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Category icon opacity tiers from 30 to 100 percent, then the orange over-budget state" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041F21"/>
      <stop offset="1" stop-color="#0A3638"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="230" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="228" rx="21" fill="none" stroke="#00D2BE" stroke-opacity="0.3" stroke-width="2"/>
  <g font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="500" y="38" font-size="18" font-weight="700" fill="#CFF7F1">ratio = spentAmount / targetAmount</text>

    <g font-size="15" font-weight="600">
      <circle cx="100" cy="112" r="32" fill="#00B4A2" fill-opacity="0.30"/><text x="100" y="188">30%</text>
      <circle cx="210" cy="112" r="32" fill="#00B4A2" fill-opacity="0.41"/><text x="210" y="188">41%</text>
      <circle cx="320" cy="112" r="32" fill="#00B4A2" fill-opacity="0.45"/><text x="320" y="188">45%</text>
      <circle cx="430" cy="112" r="32" fill="#00B4A2" fill-opacity="0.46"/><text x="430" y="188">46%</text>
      <circle cx="540" cy="112" r="32" fill="#00B4A2" fill-opacity="0.60"/><text x="540" y="188">60%</text>
      <circle cx="650" cy="112" r="32" fill="#00B4A2" fill-opacity="0.80"/><text x="650" y="188">80%</text>
      <circle cx="760" cy="112" r="32" fill="#00B4A2" fill-opacity="1"/><text x="760" y="188">100%</text>
    </g>

    <line x1="822" y1="76" x2="822" y2="200" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="4 6" stroke-width="2"/>

    <circle cx="900" cy="112" r="32" fill="#F97316"/>
    <path d="M900 96v20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="900" cy="128" r="3.2" fill="#FFFFFF"/>
    <text x="900" y="188" font-size="15" font-weight="700" fill="#FFB27A">OVER</text>
  </g>
</svg>
