<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Fundazaka: budgeting and money confidence for irregular income" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041F21"/>
      <stop offset="1" stop-color="#0A3638"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#00B4A2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00B4A2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#00D2BE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00D2BE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4A2"/>
      <stop offset="1" stop-color="#00D2BE"/>
    </linearGradient>
    <linearGradient id="barOver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#00D2BE" stroke-opacity="0.25" stroke-width="2"/>

  <!-- soft decorative rings -->
  <circle cx="660" cy="380" r="150" fill="none" stroke="#00D2BE" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="660" cy="380" r="220" fill="none" stroke="#00D2BE" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="1150" cy="40" r="90" fill="none" stroke="#00D2BE" stroke-opacity="0.08" stroke-width="2"/>

  <!-- wordmark -->
  <text x="80" y="195" font-family="'Advent Pro','Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="110" fill="#FFFFFF" letter-spacing="1"><tspan font-weight="300">funda</tspan><tspan font-weight="700">zaka</tspan></text>
  <rect x="84" y="222" width="96" height="6" rx="3" fill="url(#bar)"/>

  <text x="82" y="272" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#CFF7F1">Budgeting and money confidence</text>
  <text x="82" y="308" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="300" fill="#CFF7F1">for income that doesn&#8217;t arrive on the 25th.</text>

  <!-- pills -->
  <g font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">
    <rect x="82" y="338" width="148" height="40" rx="20" fill="#00A896" fill-opacity="0.18" stroke="#00D2BE" stroke-opacity="0.4"/>
    <text x="156" y="364" text-anchor="middle">Offline-first</text>
    <rect x="242" y="338" width="148" height="40" rx="20" fill="#00A896" fill-opacity="0.18" stroke="#00D2BE" stroke-opacity="0.4"/>
    <text x="316" y="364" text-anchor="middle">Encrypted</text>
    <rect x="402" y="338" width="148" height="40" rx="20" fill="#00A896" fill-opacity="0.18" stroke="#00D2BE" stroke-opacity="0.4"/>
    <text x="476" y="364" text-anchor="middle">5 languages</text>
  </g>

  <!-- glass card: on track -->
  <g font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" fill="#FFFFFF">
    <rect x="760" y="62" width="360" height="136" rx="22" fill="#00A896" fill-opacity="0.18" stroke="#00D2BE" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="806" cy="104" r="22" fill="#00B4A2" fill-opacity="0.85"/>
    <path d="M797 104h18M806 95v18" stroke="#041F21" stroke-width="3.5" stroke-linecap="round"/>
    <text x="842" y="100" font-size="22" font-weight="700">Groceries</text>
    <text x="842" y="124" font-size="15" font-weight="300" fill="#CFF7F1">Balance</text>
    <text x="1096" y="118" font-size="38" font-weight="700" text-anchor="end">R 640</text>
    <rect x="788" y="156" width="304" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="788" y="156" width="190" height="10" rx="5" fill="url(#bar)"/>
  </g>

  <!-- glass card: over budget -->
  <g font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" fill="#FFFFFF">
    <rect x="800" y="226" width="360" height="136" rx="22" fill="#F97316" fill-opacity="0.22" stroke="#F97316" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="846" cy="268" r="22" fill="#F97316"/>
    <path d="M846 256v14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="846" cy="278" r="2.6" fill="#FFFFFF"/>
    <text x="882" y="264" font-size="22" font-weight="700">Transport</text>
    <text x="882" y="288" font-size="15" font-weight="300" fill="#FFE3CC">Over</text>
    <text x="1136" y="282" font-size="38" font-weight="700" text-anchor="end" fill="#FFB27A">R 85</text>
    <rect x="828" y="320" width="304" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="828" y="320" width="304" height="10" rx="5" fill="url(#barOver)"/>
  </g>
</svg>
